name: freon
description: Local-first nutrition and wellness companion for the Synora hackathon.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.0
  sqlite3: ^3.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3
  file_picker: ^13.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/Outfit-OFL.txt
    - assets/fonts/HankenGrotesk-OFL.txt
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
